# Recreates the old custom prompt style:
# [time] user@host path (git-branch)
# $
add_newline = false

format = """
$time $username$hostname $directory$git_branch$git_status
$character"""

palette = "blue_purple"

[palettes.blue_purple]
periwinkle = "#8aa2f7"
sky = "#7dcfff"
azure = "#5b8def"
violet = "#a78bfa"
orchid = "#c084fc"
indigo = "#7c6cf0"

[time]
disabled = false
format = '[\[$time\]]($style)'
time_format = "%H:%M:%S"
style = "violet"

[username]
style_user = "azure"
style_root = "azure"
format = "[$user]($style)"
show_always = true

[hostname]
ssh_only = false
format = "[@$hostname]($style)"
style = "periwinkle"

[directory]
style = "sky"
truncation_length = 8
truncate_to_repo = true

[git_branch]
format = "[ ($branch)]($style)"
style = "orchid"

[git_status]
disabled = true

[character]
success_symbol = "[\\$](indigo)"
error_symbol = "[\\$](red)"
