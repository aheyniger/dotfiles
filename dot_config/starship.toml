# Recreates the old custom prompt style:
# [time] user@host path (git-branch)
# $
add_newline = false

format = """
$os$shell$time $username@$hostname $directory$nodejs$python$rust$golang$git_branch$git_status$cmd_duration
$status$character"""

palette = "blue_purple"

[palettes.blue_purple]
periwinkle = "#8aa2f7"
sky = "#7dcfff"
azure = "#5b8def"
violet = "#a78bfa"
orchid = "#c084fc"
indigo = "#7c6cf0"

[os]
disabled = true
style = "periwinkle"
format = "[$symbol]($style) "

[shell]
disabled = false
format = "[$indicator]($style)"
style = "periwinkle"
powershell_indicator = "PS "
pwsh_indicator = "PS "
bash_indicator = ""
zsh_indicator = ""
unknown_indicator = ""

[time]
disabled = false
format = '[\[$time\]]($style)'
time_format = "%H:%M:%S"
style = "violet"

[username]
style_user = "azure"
style_root = "azure"
format = "[$user]($style)"
show_always = true

[hostname]
ssh_only = false
format = "[$hostname]($style)"
style = "periwinkle"

[directory]
style = "sky"
truncation_length = 8
truncate_to_repo = true

[nodejs]
disabled = true
style = "violet"

[python]
disabled = true
style = "indigo"

[rust]
disabled = true
style = "orchid"

[golang]
disabled = true
style = "azure"

[git_branch]
format = "[($branch)]($style)"
style = "orchid"

[git_status]
disabled = false

[cmd_duration]
disabled = false
style = "sky"
format = "[⏱ $duration]($style) "
min_time = 2000

[status]
disabled = true
style = "red"
format = "[$symbol$status]($style) "
symbol = "✗"

[character]
success_symbol = "[\\$](indigo)"
error_symbol = "[\\$](red)"
