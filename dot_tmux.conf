# All settings below are commented out; uncomment the ones you want.

# Enable mouse support (scroll, click panes, resize)
#set -g mouse on

# Start window and pane numbering at 1
#set -g base-index 1
#setw -g pane-base-index 1

# Renumber windows when one is closed
#set -g renumber-windows on

# Use Ctrl-a as the prefix instead of Ctrl-b
#unbind C-b
#set -g prefix C-a
#bind C-a send-prefix

# Truecolor passthrough (needed for hex colors like the starship prompt)
#set -g default-terminal "tmux-256color"
#set -ga terminal-overrides ",*256col*:Tc"

# Larger scrollback history
#set -g history-limit 10000

# Faster escape key response (helps in vim)
#set -sg escape-time 10

# Easier split bindings that keep the current directory
#bind | split-window -h -c "#{pane_current_path}"
#bind - split-window -v -c "#{pane_current_path}"

# Reload this config with prefix + r
#bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Blue/purple status bar to match the prompt
#set -g status-style "bg=#1e1e2e,fg=#8aa2f7"
#set -g window-status-current-style "fg=#c084fc,bold"
